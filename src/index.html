<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rollbook</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Rollbook<small>Attendance and salary</small></div>
    <nav aria-label="Sections">
      <button type="button" data-view="register">Register</button>
      <button type="button" data-view="staff">Staff</button>
      <button type="button" data-view="advances">Advances</button>
      <button type="button" data-view="salary">Salary</button>
    </nav>
    <div class="biz">
      <b id="biz-name"></b>
      <button type="button" id="open-settings">Business details</button>
      <span id="saved" role="status"></span>
    </div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>Business details</h2>
    <p class="muted">Printed at the top of every salary slip.</p>
    <label>Business name<input name="business" required></label>
    <label>Address<input name="address"></label>
    <div class="row-end"><button value="cancel" class="btn line" formnovalidate>Cancel</button><button value="ok" class="btn">Save</button></div>
  </form>
</dialog>

<div id="print" aria-hidden="true"></div>

<script src="pay.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
